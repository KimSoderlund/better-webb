<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/booking.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Bättre Web Bokning</title>
</head>
<body>


     <header class = "header-bottom">
        <a href ="index.html"><img src="images\logo-tiny-dark-bättrewebb.png" alt="tiny logo"></a>
        <input type = "checkbox" id = "nav-toggle">
        <label for = "nav-toggle"><i class ="fa fa-bars"></i></label>
        <nav>
            <a href = "#">Föreläsningar</a>
            <a href = "#">Schema</a>
            <a href = "#">Bokning</a>
        </nav>
    </header>


    

    <main>
        <div class="hero-section">
            <h1>Boka din biljett nu</h1>
            <p class= "hero-text">Missa inte chansen</p>
        </div>

        <form action = "#">

            <div>
                <label for = "namn">Namn</label>
                <input type="text" id="namn" name ="namn" placeholder = "För & Efternamn" required>
            </div>
            <div>
                <label for = "email">Email</label>
                <input type = "email" id = "email" name = "email" placeholder = "E-post" required>
            </div>
            <div>
                <label for ="mat">Välj Kost</label>
                <select id = "mat" name = "mat">
                    <option value = "-"> - </option>
                    <option value = "veg"> Vegitarisk </option>
                    <option value = "fisk"> Fisk </option>
                    <option value = "kött"> Kött </option>
                </select>
            </div>

            <div>
                <p>Vilka dagar</p>
                <div class = "form-days">
                    <div>
                        <input type="checkbox" id = "fredag" name = "fredag">
                        <label for ="fredag" id="fre">Fredag</label>
                    </div>

                    <div>
                        <input type="checkbox" id = "lordag" name = "lordag">
                        <label for ="lordag" id="lor">Lördag</label>
                    </div>

                    <div>
                        <input type="checkbox" id = "sondag" name = "sondag">
                        <label for ="sondag" id="son">Söndag</label>
                    </div>
                </div>
            </div>

            <div class = "spaning">
                <label>Allergier & Annan Kost</label>
                <textarea id = "alergitext" placeholder = "..." rows="5" style="resize: none;"></textarea>
            </div>

            <button class = "cta"> Skicka </button>

        </form>

        
    </main>


</body>
</html>
