<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/booking.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Bättre Web Bokning</title>
</head>
<body>


     <header class = "header-bottom">
        <a href ="index.html"><img src="images\logo-tiny-dark-bättrewebb.png" alt="tiny logo"></a>
        <input type = "checkbox" id = "nav-toggle">
        <label for = "nav-toggle"><i class ="fa fa-bars"></i></label>
        <nav>
            <a href = "#">Föreläsningar</a>
            <a href = "#">Schema</a>
            <a href = "#">Bokning</a>
        </nav>
    </header>


    

    <main>
        <div class="hero-section">
            <h1>Boka din biljett nu</h1>
            <p class= "hero-text">Missa inte chansen</p>
        </div>

        <form action = "#">

            <div>
                <label for = "namn">Namn:</label>
                <input type="text" id="namn" name ="namn" placeholder = "För & Efternamn" required>
            </div>

            <div>
                <label for ="mat">Välj Kost</label>
                <select id = "mat" name = "mat">
                    <option value = "-"> - </option>
                    <option value = "veg"> Vegitarisk </option>
                    <option value = "fisk"> Fisk </option>
                    <option value = "kött"> Kött </option>
                </select>
            </div>

            <div>
                <p>Vilka dagar</p>
                <label for ="fredag" id="fre">Fredag</label>
                <input type="checkbox" id = "fredag" name = "fredag">

                <label for ="lordag" id="lor">Lördag</label>
                <input type="checkbox" id = "lordag" name = "lordag">
                
                <label for ="sondag" id="son">Söndag</label>
                <input type="checkbox" id = "sondag" name = "sondag">
            </div>

            <div>
                <label>Allergier</label>
                <textarea placeholder="..."></textarea>
            </div>

            <button class = "cta"> Submit </button>

        </form>


    </main>





    <footer>
        <div class = "top-footer">

            <img src = "images/logo-dark-bättrewebb.png" class ="imgstyling">
            
            <div class = "footer-column">
                <h3>Quality Hotel</h3>
                <p>Adolf Edelsvärds gata 10</p>
                <p>414 51 Göteborg</p>
            </div>

            <div class = "footer-column link-column">
                <h3>Länkar</h3>
                <a href = "#">Föreläsningar</a>
                <a href = "#">Schema</a>
                <a href = "#">Bokning</a>
            </div>

            <div class = "footer-column footer-endcolumn">
                <h3 style ="grid-column: 1/-1;">Följ oss</h3>
                <i class="fa fa-facebook-official"></i>
                <i class="fa fa-linkedin-square"></i>
                <i class="fa fa-twitter-square"></i>
                <i class="fa fa-twitch"></i>
            </div>

            <div class="footer-bottom">
                <a href="#">© 2025 Kim Söderlund</a>
            </div>

        </div>
    </footer>

    
</body>
</html>
